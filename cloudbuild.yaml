# -------------------------------------------------------
# Cloud Build configuration for Cement Plant Optimization
# (Builds and deploys API + Dashboard to Cloud Run)
# -------------------------------------------------------

steps:
  # --- Build API Image ---
  - name: 'gcr.io/cloud-builders/docker'
    id: Build API Image
    args:
      [
        'build',
        '-t',
        'us-central1-docker.pkg.dev/${PROJECT_ID}/cement-repo/cement-api:${_TAG}',
        '-t',
        'us-central1-docker.pkg.dev/${PROJECT_ID}/cement-repo/cement-api:latest',
        '-f',
        'api.Dockerfile',
        '.',
      ]

  # --- Push API Image ---
  - name: 'gcr.io/cloud-builders/docker'
    id: Push API Image
    args: ['push', 'us-central1-docker.pkg.dev/${PROJECT_ID}/cement-repo/cement-api']

  # --- Deploy API to Cloud Run ---
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Deploy API Service
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'cement-api',
        '--image=us-central1-docker.pkg.dev/${PROJECT_ID}/cement-repo/cement-api:${_TAG}',
        '--region=us-central1',
        '--platform=managed',
        '--allow-unauthenticated',
        '--set-env-vars=GOOGLE_API_KEY=${_GOOGLE_API_KEY}',
        '--quiet',
      ]
    waitFor: ['Push API Image']

  # --- Build Dashboard Image ---
  - name: 'gcr.io/cloud-builders/docker'
    id: Build Dashboard Image
    args:
      [
        'build',
        '-t',
        'us-central1-docker.pkg.dev/${PROJECT_ID}/cement-repo/cement-dashboard:${_TAG}',
        '-t',
        'us-central1-docker.pkg.dev/${PROJECT_ID}/cement-repo/cement-dashboard:latest',
        '-f',
        'dashboard.Dockerfile',
        '.',
      ]

  # --- Push Dashboard Image ---
  - name: 'gcr.io/cloud-builders/docker'
    id: Push Dashboard Image
    args: ['push', 'us-central1-docker.pkg.dev/${PROJECT_ID}/cement-repo/cement-dashboard']

  # --- Deploy Dashboard to Cloud Run ---
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Deploy Dashboard Service
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'cement-dashboard',
        '--image=us-central1-docker.pkg.dev/${PROJECT_ID}/cement-repo/cement-dashboard:${_TAG}',
        '--region=us-central1',
        '--platform=managed',
        '--allow-unauthenticated',
        '--set-env-vars=API_URL=https://cement-api-${_SERVICE_HASH}-${_REGION_CODE}.a.run.app',
        '--quiet',
      ]
    waitFor: ['Push Dashboard Image']

# --- Images to Push ---
images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/cement-repo/cement-api:${_TAG}'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/cement-repo/cement-api:latest'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/cement-repo/cement-dashboard:${_TAG}'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/cement-repo/cement-dashboard:latest'

timeout: '1800s'

# --- Substitutions ---
substitutions:
